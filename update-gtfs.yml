name: Aggiorna GTFS ACTV

on:
  schedule:
    - cron: '0 3 * * 1'   # ogni lunedì alle 3:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica i GTFS ACTV
        run: |
          mkdir -p data
          for f in navigazione/actv_nav automobilistico/actv_aut; do
            out="data/$(basename $f).zip"
            curl -fL --retry 3 "https://actv.avmspa.it/sites/default/files/attachments/opendata/$f.zip" -o "$out.tmp"
            head -c 2 "$out.tmp" | grep -q PK
            mv "$out.tmp" "$out"
          done

      - name: Commit se ci sono modifiche
        run: |
          git config user.name "Bot Aggiornamento GTFS"
          git config user.email "bot@actions.github.io"
          git add data/*.zip
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico file GTFS ACTV"
            git push
          fi
