<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<!-- Niente maximum-scale/user-scalable=no: bloccare lo zoom della pagina viola l'accessibilità (WCAG 1.4.4). La mappa gestisce da sé i propri gesti. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venezia TPL live</title>
<meta name="description" content="Autobus, tram e battelli di Venezia in tempo reale, con livello e tendenza della marea.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TPL Venezia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Nessuno script né stile "in linea" salvo gli attributi style generati dalla pagina: la Content-Security-Policy del server vieta gli script nella pagina. -->
<script src="/js/theme-init.js"></script>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<!-- Le icone stanno tutte in /icons/sprite.svg e si usano con <use href="/icons/sprite.svg#i-nome">. Sono decorative (aria-hidden): ogni pulsante ha un nome testuale. -->
<div id="wrap">
  <div id="map" role="application" aria-label="Mappa dei mezzi pubblici in tempo reale" tabindex="0"></div>

  <!-- ALTO A SINISTRA: stato dei dati -->
  <div id="topleft"><span id="status" aria-live="off">Caricamento…</span><button id="linefilter" class="chip-f" type="button" hidden></button><button id="nearchip" class="chip-f near" type="button" hidden></button></div>

  <!-- RICERCA (si apre a barra in alto) -->
  <div id="search-container" role="search">
    <div class="search-input-wrap">
      <svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-search"/></svg>
      <input id="filter" type="search" placeholder="Cerca fermata o linea" autocomplete="off" enterkeyhint="search" maxlength="80" aria-label="Cerca fermata o linea">
      <button id="search-clear" class="ibtn sm" type="button" aria-label="Cancella la ricerca" hidden><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-close"/></svg></button>
    </div>
    <div id="search-results" role="listbox" aria-label="Risultati della ricerca"></div>
  </div>

  <!-- COLONNA CONTROLLI A DESTRA: servizi · ricerca/posizione/tema · avvisi/marea/installa -->
  <nav id="controls" aria-label="Strumenti della mappa">
    <div class="group" role="group" aria-label="Servizi da mostrare">
      <label class="ibtn" title="Battelli"><input type="checkbox" name="src" value="nav" checked><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-ship"/></svg><span class="sr-only">Battelli</span></label>
      <label class="ibtn" title="Autobus e tram"><input type="checkbox" name="src" value="aut" checked><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-bus"/></svg><span class="sr-only">Autobus e tram</span></label>
    </div>
    <div class="group">
      <button id="search-toggle-btn" class="ibtn" type="button" aria-label="Cerca fermata o linea" aria-expanded="false" aria-controls="search-container" title="Cerca"><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-search"/></svg></button>
      <button id="locate" class="ibtn" type="button" aria-label="Mostra la mia posizione" title="La mia posizione"><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-locate"/></svg></button>
      <button id="theme-btn" class="ibtn" type="button" aria-label="Tema scuro" aria-pressed="false" title="Tema scuro"><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-moon"/></svg></button>
    </div>
    <div class="group">
      <button id="avvisi-btn" class="ibtn" type="button" aria-label="Avvisi di servizio" aria-expanded="false" aria-controls="avvisi" title="Avvisi di servizio"><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-warn"/></svg><span id="avvisi-count" class="cntb" aria-hidden="true" hidden></span></button>
      <button id="tide-btn" class="ibtn" type="button" aria-label="Marea a Venezia" aria-expanded="false" aria-controls="tide" title="Marea"><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-tide"/></svg><span class="dotc" aria-hidden="true"></span></button>
      <button id="install-btn" class="ibtn" type="button" aria-label="Installa l'app" title="Installa l'app" hidden><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-download"/></svg></button>
    </div>
  </nav>

  <!-- FINESTRA MAREA (si apre dal pulsante onde) -->
  <section id="tide" class="card" role="dialog" aria-modal="false" aria-labelledby="tide-title" tabindex="-1" hidden>
    <header class="card-h"><h2 id="tide-title">Marea a Venezia</h2><button id="tide-close" class="ibtn sm" type="button" aria-label="Chiudi marea"><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-close"/></svg></button></header>
    <div id="tide-body" aria-live="polite">Caricamento…</div>
  </section>

  <!-- FINESTRA AVVISI DI INFOMOBILITÀ (sito ACTV + canale Telegram) -->
  <section id="avvisi" class="card" role="dialog" aria-modal="false" aria-labelledby="avvisi-title" tabindex="-1" hidden>
    <header class="card-h"><h2 id="avvisi-title">Avvisi di servizio</h2><button id="avvisi-close" class="ibtn sm" type="button" aria-label="Chiudi avvisi"><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-close"/></svg></button></header>
    <div id="avvisi-body" aria-live="polite">Caricamento…</div>
  </section>

  <!-- PANNELLO DETTAGLI (fermata / zona / corsa) -->
  <aside id="panel" class="card side-panel" hidden aria-label="Dettagli">
    <div class="ph">
      <button id="pback" class="linkback" type="button" hidden></button>
      <div class="ph-main">
        <div class="ph-content">
          <div class="ph-badge-area" id="pbadge"></div>
          <div class="ph-top" id="pname"></div>
          <div class="ph-sub muted" id="psub"></div>
          <div class="ph-status" id="pstatus"></div>
        </div>
        <div class="ph-actions">
          <!-- «Segui il mezzo»: visibile solo nel pannello di una corsa, accanto alla X, con lo stesso aspetto degli altri pulsanti -->
          <button id="pfollow" class="ibtn sm" type="button" aria-pressed="false" aria-label="Segui il mezzo" title="Segui il mezzo" hidden><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-follow"/></svg></button>
          <button id="pclose" class="ibtn sm" type="button" aria-label="Chiudi dettagli" title="Chiudi"><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-close"/></svg></button>
        </div>
      </div>
      <div id="chips-area" class="chips-container"></div>
    </div>
    <div id="plist"></div>
  </aside>

  <!-- INVITO A INSTALLARE -->
  <div id="snack" class="snack" role="status" hidden>
    <span id="snack-text">Installa l'app sul telefono: si apre più in fretta, a schermo intero.</span>
    <button id="snack-install" class="btn" type="button">Installa</button>
    <button id="snack-close" class="ibtn sm" type="button" aria-label="Non ora"><svg class="ic" aria-hidden="true"><use href="/icons/sprite.svg#i-close"/></svg></button>
  </div>
</div>

<!-- DOCK IN BASSO (fuori dalla mappa; contenuto largo al massimo 760 px e centrato) -->
<footer class="dock" id="bottom-bar">
  <div class="dock-in">
    <div class="dock-row">
      <div class="seg" role="radiogroup" aria-label="Modalità">
        <label><input type="radio" name="mode" value="live" checked><span class="live-indicator" aria-hidden="true"></span>Tempo reale</label>
        <label><input type="radio" name="mode" value="sched">Pianificato</label>
      </div>
      <div id="clock-section">
        <div class="time-display" id="clock-time">00:00:<small>00</small></div>
        <span class="muted" id="updated-ago">· ora</span>
      </div>
      <div id="sched-opts">
        <input id="tl-date" type="date" aria-label="Data">
        <select id="tl-speed" aria-label="Velocità di riproduzione">
          <option value="1">1×</option><option value="5" selected>5×</option><option value="15">15×</option><option value="60">60×</option>
        </select>
      </div>
    </div>
    <div id="timeline-controls">
      <button id="tl-play" type="button" aria-label="Avvia"></button>
      <div class="time-display" id="tl-time" aria-label="Orario simulato">12:00:00</div>
      <input id="tl-range" type="range" min="0" max="86400" value="43200" step="1" aria-label="Orario della giornata">
      <button id="tl-now" type="button" class="ora-btn">ORA</button>
    </div>
    <p id="credits">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> · ACTV (GTFS-RT) · <a href="https://dati.venezia.it/?q=content/cpsm-dati-meteomarini-laguna-e-litorale-veneziano" target="_blank" rel="noopener noreferrer">CPSM Venezia</a></p>
  </div>
</footer>

<script src="/vendor/leaflet/leaflet.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
