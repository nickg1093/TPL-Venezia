<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<!-- Niente maximum-scale/user-scalable=no: bloccare lo zoom della pagina viola l'accessibilità (WCAG 1.4.4). La mappa gestisce da sé i propri gesti. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venezia TPL live</title>
<meta name="description" content="Autobus, tram e battelli di Venezia in tempo reale, con livello e tendenza della marea.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TPL Venezia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Tema scelto PRIMA del primo disegno della pagina (nessun lampo di tema sbagliato): preferenza salvata, altrimenti quella del sistema -->
<script>(function(){var r=document.documentElement,t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';r.dataset.theme=t;var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#121a28':'#ffffff'})()</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* =====================================================================================================
   DESIGN SYSTEM
   - Colori: variabili per tema (chiaro/scuro). Tutte le coppie testo/sfondo verificate WCAG AA (>= 4.5:1).
   - Testo: base 16 px, mai sotto 13 px (12 px solo per l'attribuzione della mappa); unità rem, quindi segue le impostazioni di sistema.
   - Bersagli di tocco: >= 44 px (Apple HIG 44 pt, Material 48 dp); controlli principali 48 px.
   - Nessuna informazione affidata al solo colore: stato = testo + icona/forma.
   - Movimento ridotto e contrasto alto rispettati.
   ===================================================================================================== */
:root{
  --fs-xs:.8125rem;--fs-sm:.875rem;--fs-md:1rem;--fs-lg:1.125rem;--fs-xl:1.375rem;--fs-hero:2.75rem;
  --r-sm:12px;--r-md:16px;--r-lg:24px;--gap:12px;--tap:48px;
  --safe-t:env(safe-area-inset-top,0px);--safe-r:env(safe-area-inset-right,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);
  --bg:#e9eef4;--surface:#ffffff;--surface-2:#eef2f7;--glass:rgba(255,255,255,.94);
  --fg:#0b1520;--muted:#475467;--line:rgba(11,21,32,.14);--line-strong:rgba(11,21,32,.32);
  --accent:#0b62c4;--on-accent:#ffffff;--accent-soft:rgba(11,98,196,.12);
  --late:#b42318;--ok:#067647;--warn:#9a5b00;--info:#0b62c4;
  --tag-fg:#6b4200;--tag-bg:#fff1c2;--pt-bg:#facc15;--pt-fg:#1a1200;
  --shadow:0 8px 28px rgba(11,21,32,.16),0 1px 3px rgba(11,21,32,.12);
}
:root[data-theme="dark"]{
  --bg:#0a1019;--surface:#121a28;--surface-2:#1a2436;--glass:rgba(18,26,40,.94);
  --fg:#eef3f9;--muted:#a8b5c7;--line:rgba(238,243,249,.16);--line-strong:rgba(238,243,249,.4);
  --accent:#6cb2ff;--on-accent:#04121f;--accent-soft:rgba(108,178,255,.18);
  --late:#ff8f85;--ok:#5ed39a;--warn:#ffbf5e;--info:#6cb2ff;
  --tag-fg:#ffd666;--tag-bg:#3a3115;--pt-bg:#facc15;--pt-fg:#1a1200;
  --shadow:0 10px 32px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.5);
}
@media (prefers-contrast:more){:root{--line:var(--line-strong)}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--fg);overflow:hidden;
  font:400 var(--fs-md)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%;font-synthesis:none}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:where(a,button,input,select,summary,[tabindex]):focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:inherit}
svg.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.ic.sm{width:18px;height:18px}
.muted{color:var(--muted);font-size:var(--fs-xs)}
.late{color:var(--late)}.ok,.early{color:var(--ok)}

/* ---------- AREA MAPPA ---------- */
#wrap{position:relative;flex:1;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;background:var(--bg);outline-offset:-3px}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.8)}
.leaflet-container{font:inherit}
.leaflet-tooltip{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow);font-size:var(--fs-sm);font-weight:600;padding:6px 10px}
.leaflet-tooltip-top:before{border-top-color:var(--surface)}
.leaflet-bar{border:0!important;border-radius:var(--r-md)!important;box-shadow:var(--shadow)!important;overflow:hidden}
.leaflet-bar a{width:44px!important;height:44px!important;line-height:44px!important;font-size:1.375rem;background:var(--glass);color:var(--fg);border-color:var(--line)!important}
.leaflet-bar a:hover{background:var(--surface-2);color:var(--fg)}
.leaflet-control-attribution{background:var(--glass)!important;color:var(--muted)!important;font-size:.75rem;border-radius:var(--r-sm) 0 0 0;padding:2px 8px!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-bottom.leaflet-right .leaflet-control{margin-right:var(--gap);margin-bottom:var(--gap)}

/* ---------- SUPERFICI (pillole e schede) ---------- */
.surface{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:var(--shadow)}

/* ---------- ALTO A SINISTRA: stato e "segui" ---------- */
#topleft{position:absolute;z-index:1000;top:calc(var(--gap) + var(--safe-t));left:calc(var(--gap) + var(--safe-l));display:flex;gap:8px;flex-wrap:wrap;
  max-width:calc(100% - var(--tap) - 4*var(--gap) - var(--safe-l) - var(--safe-r));pointer-events:none}
#topleft>*{pointer-events:auto}
#status{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:99px;font-size:var(--fs-xs);font-weight:600;color:var(--muted);
  background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow)}
#status.err{color:var(--late);border-color:var(--late)}
#follow{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px 0 14px;border-radius:99px;border:0;font:inherit;font-size:var(--fs-sm);font-weight:700;
  background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);cursor:pointer}

/* ---------- COLONNA CONTROLLI A DESTRA ---------- */
#controls{position:absolute;z-index:1000;top:calc(var(--gap) + var(--safe-t));right:calc(var(--gap) + var(--safe-r));display:flex;flex-direction:column;gap:var(--gap);
  max-height:calc(100% - 2*var(--gap) - var(--safe-t) + 24px);overflow-y:auto;scrollbar-width:none;padding:12px;margin:-12px;pointer-events:none}   /* il padding lascia spazio alle ombre (corte); i clic passano alla mappa tranne che sui gruppi */
#controls::-webkit-scrollbar{display:none}
.group{pointer-events:auto;display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:28px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 3px 12px rgba(11,21,32,.2),0 1px 2px rgba(11,21,32,.14)}
.ibtn{position:relative;width:var(--tap);height:var(--tap);flex:none;display:inline-grid;place-items:center;padding:0;border:0;border-radius:50%;background:transparent;color:var(--fg);cursor:pointer;
  font:inherit;transition:background .15s,color .15s,transform .1s}
.ibtn:hover{background:var(--accent-soft)}
.ibtn:active{transform:scale(.94)}
.ibtn.sm{width:44px;height:44px}
.ibtn[aria-pressed="true"],.ibtn[aria-expanded="true"],label.ibtn:has(input:checked){background:var(--accent);color:var(--on-accent)}
/* stato "attivo" anche senza colore: segno di spunta sui filtri di servizio */
label.ibtn input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
label.ibtn:has(input:checked)::after{content:"";position:absolute;right:5px;bottom:5px;width:10px;height:10px;border-radius:50%;background:var(--on-accent);
  box-shadow:0 0 0 2px var(--accent);-webkit-mask:none}
label.ibtn:has(input:checked)::before{content:"";position:absolute;right:8.5px;bottom:9.5px;width:3px;height:5px;border:solid var(--accent);border-width:0 1.6px 1.6px 0;transform:rotate(40deg);z-index:1}
label.ibtn:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
#tide-btn .dotc{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--muted);border:2px solid var(--glass)}
#tide-btn[aria-expanded="true"] .dotc{border-color:var(--accent)}
#tide-btn .dotc[data-cat="normale"]{background:var(--ok)}
#tide-btn .dotc[data-cat="sostenuta"]{background:var(--warn)}
#tide-btn .dotc[data-cat="molto-sostenuta"],#tide-btn .dotc[data-cat="eccezionale"]{background:var(--late)}
#tide-btn .dotc[data-cat="bassa"],#tide-btn .dotc[data-cat="bassa-eccezionale"]{background:var(--info)}

/* ---------- RICERCA ---------- */
#search-container{position:absolute;z-index:1150;top:calc(var(--gap) + var(--safe-t));left:calc(var(--gap) + var(--safe-l));right:calc(var(--tap) + 3*var(--gap) + var(--safe-r) + 8px);max-width:460px;display:none}
#search-container.expanded{display:block}
.search-input-wrap{display:flex;align-items:center;gap:10px;min-height:var(--tap);padding:0 4px 0 16px;border-radius:99px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow)}
.search-input-wrap input{flex:1;min-width:0;height:44px;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:var(--fs-md)}
.search-input-wrap input[type=search]::-webkit-search-cancel-button{display:none}   /* il pulsante nativo è minuscolo: c'è il nostro da 44 px */
.search-input-wrap input::placeholder{color:var(--muted);opacity:1}
.search-input-wrap:focus-within{outline:3px solid var(--accent);outline-offset:2px}
#search-results{display:none;margin-top:8px;max-height:min(50vh,26rem);overflow-y:auto;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
#search-results.active{display:block}
.search-category{position:sticky;top:0;padding:8px 16px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.search-item{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:var(--fs-md)}
.search-item:hover{background:var(--accent-soft)}
.search-item>.muted{margin-left:auto}

/* ---------- SCHEDE: marea, pannello dettagli ---------- */
.card{position:absolute;z-index:1100;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--fg)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px 4px 20px}
.card-h h2{margin:0;font-size:var(--fs-lg);font-weight:700}

/* Marea: a sinistra della colonna controlli, allineata al suo pulsante (posizione fissata da JS) */
#tide{width:min(340px,calc(100% - var(--tap) - 4*var(--gap) - var(--safe-l) - var(--safe-r)));max-height:calc(100% - 2*var(--gap));overflow-y:auto;right:calc(var(--tap) + 3*var(--gap) + var(--safe-r) + 4px);top:var(--gap)}
#tide-body{padding:4px 20px 18px}
.tide-level{display:flex;align-items:baseline;gap:6px;line-height:1}
.tide-level .num{font-size:var(--fs-hero);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tide-level .unit{font-size:var(--fs-lg);font-weight:600;color:var(--muted)}
.tide-cat{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:6px 14px 6px 10px;border-radius:99px;font-size:var(--fs-sm);font-weight:700;background:var(--surface-2);border:1.5px solid var(--cat,var(--line-strong))}
.tide-cat::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--cat,var(--muted))}
.tide-cat[data-cat="normale"]{--cat:var(--ok)}.tide-cat[data-cat="sostenuta"]{--cat:var(--warn)}
.tide-cat[data-cat="molto-sostenuta"],.tide-cat[data-cat="eccezionale"]{--cat:var(--late)}
.tide-cat[data-cat="bassa"],.tide-cat[data-cat="bassa-eccezionale"]{--cat:var(--info)}
.tide-trend{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:var(--fs-md);font-weight:600}
.tide-trend .ic{width:26px;height:26px;padding:3px;border-radius:50%;background:var(--accent-soft);color:var(--accent);stroke-width:2.25}
.tide-next{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.tide-next li{display:flex;justify-content:space-between;gap:12px;min-height:44px;align-items:center;border-bottom:1px solid var(--line);font-size:var(--fs-sm)}
.tide-next b{font-weight:700}.tide-next .v{font-variant-numeric:tabular-nums;font-weight:700}
.tide-spark{display:block;width:100%;height:64px;margin-top:14px;overflow:visible}
.tide-spark path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tide-spark circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.tide-note{margin:12px 0 0;padding:8px 12px;border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:600;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--fg);border:1px solid var(--warn)}
.tide-foot{margin:14px 0 0;font-size:var(--fs-xs);color:var(--muted);line-height:1.45}
.tide-foot a{color:var(--accent);display:flex;align-items:center;min-height:44px;font-weight:600}

/* Pannello dettagli (fermata / corsa): a SINISTRA su schermi larghi, "bottom sheet" su telefono */
.side-panel{display:flex;flex-direction:column;overflow:hidden;left:calc(var(--gap) + var(--safe-l));top:calc(var(--gap) + var(--safe-t) + 52px);bottom:auto;max-height:calc(100% - 52px - 2*var(--gap) - var(--safe-t));
  width:min(420px,calc(100% - var(--tap) - 4*var(--gap) - var(--safe-l) - var(--safe-r)));height:auto}
.ph{flex:none;padding:14px 8px 10px 16px;border-bottom:1px solid var(--line)}
.ph-main{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ph-content{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.ph-badge-area{grid-row:span 2;display:flex;align-items:center;min-width:0}
.ph-top{grid-column:2;font-size:var(--fs-lg);font-weight:700;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph-sub{grid-column:2;line-height:1.35}
.ph-status{grid-column:1/-1;margin-top:6px;font-size:var(--fs-sm);font-weight:600}
#pback{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;display:inline-block;padding:6px 0}
.chips-container{margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line-strong);background:transparent;color:var(--fg);font:inherit;font-size:var(--fs-sm);font-weight:700;cursor:pointer}
button.chip:hover{background:var(--accent-soft)}
button.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#plist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 8px calc(10px + var(--safe-b))}
.banner{margin:6px 8px;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--late);color:var(--late);font-weight:700;font-size:var(--fs-sm)}

/* righe delle partenze */
.dep{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;min-height:64px;padding:10px 10px;border-radius:var(--r-md)}
.dep::after,.st::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:1px;background:var(--line);pointer-events:none}   /* separatore dritto: il bordo inferiore seguirebbe gli angoli arrotondati */
.dep.go{cursor:pointer}.dep.go:hover{background:var(--accent-soft)}
.dm,.sn{min-width:0;display:flex;flex-direction:column;gap:2px}
.dh,.nm{font-weight:700;font-size:var(--fs-md);line-height:1.25;overflow-wrap:anywhere}
.dn,.sn .muted{font-size:var(--fs-xs);color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.3}
.dn.late{color:var(--late)}.dn.ok,.dn.early{color:var(--ok)}.dn.late,.dn.ok,.dn.early{font-weight:700}
.dt,.tm{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;text-align:right}
.dt-time-wrap,.tm-time-wrap{display:flex;align-items:baseline;gap:6px;line-height:1.1}
.dt strong,.tm strong{font-size:var(--fs-lg);font-weight:800;font-variant-numeric:tabular-nums}
strong.late{color:var(--late)}strong.ok,strong.early{color:var(--ok)}
.dt .in-min,.tm .muted{font-size:var(--fs-xs);font-weight:700;color:var(--muted);line-height:1.2}
.dt .in-min.late{color:var(--late)}.dt .in-min.ok,.dt .in-min.early{color:var(--ok)}
.cx{opacity:.6}.cx .dh,.cx .nm{text-decoration:line-through}
.sched-crossed{text-decoration:line-through;color:var(--muted);font-size:var(--fs-xs);font-weight:500}
.req-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:700;font-size:var(--fs-xs);line-height:1.3;color:var(--tag-fg);background:var(--tag-bg);border:1px solid var(--tag-fg)}

/* timeline della corsa */
.tl{position:relative;z-index:0;padding-top:4px}
.st{position:relative;display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;min-height:60px;padding:8px 10px 8px 4px;border-radius:var(--r-md);cursor:pointer}
.st:hover{background:var(--accent-soft)}
.rail-col{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center}
.rail-line{position:absolute;left:50%;top:-9px;bottom:-9px;width:3px;margin-left:-1.5px;background:var(--line-strong);z-index:1}
.st.first .rail-line{top:50%}.st.last .rail-line{bottom:50%}
.dot{position:relative;z-index:3;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--rc);display:grid;place-items:center;font-size:.8125rem;font-weight:900;line-height:1}
.st.passed .dot{width:22px;height:22px;background:var(--rc);color:var(--check-fg,#fff);border-color:var(--rc)}
@keyframes pulse-dot{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rc) 65%,transparent)}70%{box-shadow:0 0 0 9px color-mix(in srgb,var(--rc) 0%,transparent)}100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rc) 0%,transparent)}}
.st.at .dot,.st.next .dot{width:22px;height:22px;animation:pulse-dot 1.8s infinite ease-out}
.st.at .nm,.st.next .nm{font-size:var(--fs-lg)}
.st.passed .nm,.st.passed .tm,.st.passed .muted{opacity:.62}
.trav{position:absolute;top:0;width:3px;margin-left:-1.5px;height:0;background:var(--rc);z-index:2}
.veh{position:absolute;top:0;width:30px;height:30px;margin-left:-15px;margin-top:-15px;border-radius:50%;background:var(--rc);color:var(--check-fg,#fff);border:3px solid var(--surface);
  box-shadow:0 3px 8px rgba(0,0,0,.35);display:grid;place-items:center;font-size:.9375rem;z-index:4;transition:top .9s ease}
.trav{transition:height .9s ease}

.pt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;font-size:var(--fs-xs);font-weight:900;background:var(--pt-bg);color:var(--pt-fg)}
.pt.sm{min-width:20px;height:20px;font-size:.75rem}

/* ---------- BADGE LINEA (mappa ed elenchi) ---------- */
.leaflet-marker-icon.bus-marker{will-change:transform;background:none;border:0}
.bus{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--c,#0a6c8c);color:var(--t,#fff);font:800 .8125rem/1 system-ui,sans-serif;
  border:2.5px solid var(--b,#fff);box-shadow:0 2px 6px rgba(0,0,0,.4);white-space:nowrap;cursor:pointer;padding:0}
.bus.aut{border-radius:8px;width:auto;min-width:32px;height:24px;padding:0 6px}
.bus.sched{border-style:dashed;opacity:.92}
.bus.sel{outline:3px solid var(--accent);outline-offset:2px}
.dep .bus,.ph .bus,.search-item .bus{height:34px;min-width:46px;padding:0 8px;font-size:var(--fs-sm);border-radius:10px;cursor:inherit}
.dep .bus:not(.aut),.ph .bus:not(.aut){width:34px;min-width:34px;border-radius:50%}
@keyframes blink-live{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.live-indicator{display:inline-block;width:8px;height:8px;background:var(--ok);border-radius:50%;animation:blink-live 2s infinite ease-in-out}

/* ---------- DOCK IN BASSO (fuori dalla mappa: niente sovrapposizioni con zoom e attribuzioni) ---------- */
.dock{flex:none;position:relative;z-index:1200;display:flex;flex-direction:column;gap:8px;padding:10px calc(var(--gap) + var(--safe-r)) calc(10px + var(--safe-b)) calc(var(--gap) + var(--safe-l));
  background:var(--surface);border-top:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -6px 24px rgba(11,21,32,.14)}
.dock-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.seg label{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:99px;font-size:var(--fs-sm);font-weight:700;cursor:pointer;user-select:none;color:var(--fg)}
.seg label:has(input:checked){background:var(--accent);color:var(--on-accent)}
.seg label:has(input:checked) .live-indicator{background:var(--on-accent)}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
#clock-section{display:flex;align-items:center;gap:8px}
.time-display{display:inline-flex;align-items:baseline;gap:2px;font-size:var(--fs-lg);font-weight:800;font-variant-numeric:tabular-nums}
.time-display small{font-size:var(--fs-sm);font-weight:600;color:var(--muted)}
#timeline-controls{display:none;flex-wrap:wrap;align-items:center;gap:8px 10px}
#timeline-controls.active{display:flex}
#tl-play{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);cursor:pointer}
.ora-btn{min-height:44px;padding:0 18px;border:1.5px solid var(--ok);border-radius:99px;background:transparent;color:var(--ok);font:inherit;font-size:var(--fs-sm);font-weight:800;letter-spacing:.04em;cursor:pointer}
.ora-btn:hover{background:color-mix(in srgb,var(--ok) 14%,transparent)}
#tl-date,#tl-speed{min-height:44px;padding:0 12px;border:1.5px solid var(--line-strong);border-radius:99px;background:var(--surface);color:var(--fg);font:inherit;font-size:var(--fs-sm);font-weight:600}
#tl-range{flex:1 1 100%;order:9;height:44px;margin:0;accent-color:var(--accent);cursor:pointer}

#credits{margin:0;text-align:center;font-size:var(--fs-xs);line-height:1.3;color:var(--muted)}
#credits a{display:inline-block;padding:5px 3px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}   /* area di tocco >= 24 px (WCAG 2.2 AA) */

/* ---------- AVVISO "INSTALLA" ---------- */
.snack{position:absolute;z-index:1300;left:calc(var(--gap) + var(--safe-l));right:calc(var(--tap) + 3*var(--gap) + var(--safe-r) + 8px);bottom:calc(var(--gap) + 44px);max-width:440px;display:flex;align-items:center;gap:12px;
  padding:12px 8px 12px 16px;border-radius:var(--r-md);background:var(--fg);color:var(--bg);box-shadow:var(--shadow);font-size:var(--fs-sm);font-weight:600}
.snack span{flex:1;min-width:0}
.snack .btn{min-height:44px;padding:0 16px;border:0;border-radius:99px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:800;cursor:pointer}
.snack .ibtn{color:var(--bg)}.snack .ibtn:hover{background:rgba(127,127,127,.3)}
.snack svg.ic.sm{vertical-align:-3px}

/* ---------- TELEFONO ---------- */
@media (max-width:640px){
  #status{display:none}
  /* con il pannello aperto la colonna controlli si nasconde: nessuna sovrapposizione col foglio inferiore */
  body.has-panel #controls{display:none}
  .side-panel{left:0;right:0;bottom:0;top:auto;width:auto;max-height:min(64%,34rem);height:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom:0}
  .side-panel .ph{padding-top:22px;position:relative}
  .side-panel .ph::before{content:"";position:absolute;top:8px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--line-strong)}
  #tide{top:var(--gap)}
  #search-container{max-width:none}
  .snack{right:calc(var(--gap) + var(--safe-r));bottom:var(--gap)}
  .dock-row{justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

<script>
const $ = id => document.getElementById(id);
const ICON = { nav: '🚢', aut: '🚌' };
const POLL_MS = 2000, MIN_STOP_ZOOM = 14;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const p2 = n => String(n).padStart(2, '0');
const nowSecs = () => { const d = new Date(); return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(); };
const fmtSecs = s => `${p2(Math.floor(s / 3600) % 24)}:${p2(Math.floor(s % 3600 / 60))}:${p2(s % 60)}`;
const localDate = () => { const d = new Date(); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; };

const statusEl = $('status'), filterEl =$('filter'), resultsEl = $('search-results'), panel =$('panel'), plist = $('plist'), chipsArea =$('chips-area');
const pname = $('pname'), psub = $('psub'), pstatus =$('pstatus'), pbadge = $('pbadge'), followEl =$('follow');
const range = $('tl-range'), dateEl =$('tl-date');
const searchContainer = $('search-container'), searchToggleBtn =$('search-toggle-btn');

let mode = 'live', staticVer = -1, lastUpdate = Date.now(), lastLoadSecs = -1, isPlaying = false, playTimer = null;
const active = new Set(['nav', 'aut']);
let routesData = {}, stops = [], vehicles = [];
let openStop = null, openStopName = '', openSrc = null, openTrip = null, panelTimer = null, lastDeps = null, lastTrip = null, openZone = null;
let selVeh = null, follow = false, followAfter = 0, routeToken = 0, vehMemo = { trip: null, y: 0 };

dateEl.value = localDate();
range.value = nowSecs();
const keyOf = () => [...active].join(',');
const schedQS = () => mode === 'sched' ? `&secs=${range.value}&date=${dateEl.value.replace(/-/g, '')}` : '';

// RICERCA: barra in alto; il pulsante la apre/chiude (chiudendo si azzera tutto); un clic fuori la richiude lasciando visibile la linea scelta
function setSearch(on) {
  searchContainer.classList.toggle('expanded', on); searchToggleBtn.setAttribute('aria-expanded', String(on));
  if (on) { closeTide(); filterEl.focus(); }
  else { filterEl.value = ''; $('search-clear').hidden = true; resultsEl.classList.remove('active'); resultsEl.innerHTML = ''; clearRoutes(); }
}
searchToggleBtn.onclick = e => { e.stopPropagation(); setSearch(!searchContainer.classList.contains('expanded')); };
document.addEventListener('click', e => {
  if (searchContainer.classList.contains('expanded') && !searchContainer.contains(e.target) && !searchToggleBtn.contains(e.target)) collapseSearch();
});

const map = L.map('map', { preferCanvas: true, zoomControl: false, attributionControl: false }).setView([45.437, 12.335], 12);
if (matchMedia('(pointer: fine)').matches) L.control.zoom({ position: 'bottomright', zoomInTitle: 'Ingrandisci', zoomOutTitle: 'Riduci' }).addTo(map);   // su touch si usa il pizzico
// l'attribuzione di OpenStreetMap è nel dock in basso (#credits): sempre visibile e mai coperta da pannelli o finestre
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
const lineLayer = L.layerGroup().addTo(map), tripLayer = L.layerGroup().addTo(map), stopLayer = L.layerGroup().addTo(map);

function updateClock() {
  if (mode !== 'live') return;
  const n = new Date();
  $('clock-time').innerHTML = `${p2(n.getHours())}:${p2(n.getMinutes())}:<small>${p2(n.getSeconds())}</small>`;
  const s = Math.floor((Date.now() - lastUpdate) / 1000);
  $('updated-ago').textContent = s <= 2 ? '· ora' : `· ${s}s fa`;
}
setInterval(updateClock, 1000);

const syncPlay = () => { $('tl-play').innerHTML = `<svg class="ic" aria-hidden="true"><use href="#i-${isPlaying ? 'pause' : 'play'}"/></svg>`; $('tl-play').setAttribute('aria-label', isPlaying ? 'Pausa' : 'Avvia'); };
const stopPlay = () => { isPlaying = false; clearInterval(playTimer); syncPlay(); };
function applyTime(secs, force) {
  range.value = secs; $('tl-time').textContent = fmtSecs(secs);
  if (force || Math.abs(secs - lastLoadSecs) >= 5) { lastLoadSecs = secs; load(); if (openStop) loadDepartures(); }
}
$('tl-play').onclick = () => {
  isPlaying = !isPlaying; syncPlay(); clearInterval(playTimer);
  if (isPlaying) playTimer = setInterval(() => { const v = +range.value + +$('tl-speed').value; applyTime(v > 86400 ? 0 : v); }, 1000); };$('tl-now').onclick = () => { stopPlay(); dateEl.value = localDate(); applyTime(nowSecs(), true); };
range.oninput = () => applyTime(+range.value);
dateEl.onchange = () => applyTime(+range.value, true);

const vehIcon = (src, label) => src === 'aut' ? (/^tram/i.test(String(label ?? '').trim()) ? '🚊' : '🚌') : '🚢';
const NT = ['lido di venezia', 'ammiana', 'san nicolo', 'san nicolò', 'metamauco', 'marco polo', 'pellestrina'];
function vehName(src, label) {
  const l = String(label ?? '').trim();
  if (!l) return '';
  if (src === 'aut') { const t = /^tram_(.+)$/i.exec(l); return t ? `TRAM ${t[1]}` : /^tram/i.test(l) ? l.toUpperCase() : `BUS ${l}`; }
  if (NT.some(v => l.toLowerCase().includes(v))) return `N/T ${l.toUpperCase()}`;
  if (/^\d+$/.test(l)) { const n = +l; return n <= 99 && n >= 1 ? `M/B ${n}` : n >= 100 && n <= 300 ? `M/S ${n}` : `mezzo ${n}`; }
  return `M/N ${l}`;
}
// Luminanza relativa WCAG; il testo del badge è bianco o quasi nero a seconda di quale dà il contrasto MIGLIORE con il colore della linea
function lum(hex) {
  const n = parseInt(hex.slice(1), 16), f = c => { c /= 255; return c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; };
  return .2126 * f((n >> 16) & 255) + .7152 * f((n >> 8) & 255) + .0722 * f(n & 255);
}
function contrast(hex) {
  const L = lum(hex);
  return 1.05 / (L + .05) >= (L + .05) / (lum('#0f172a') + .05) ? '#ffffff' : '#0f172a';
}
// Linea sulla mappa con contorno: resta leggibile anche se il colore è chiaro (es. bianco della linea 1) e in entrambi i temi
function drawLine(pts, k, layer, op) {
  const light = lum(k.rail) > .5;
  L.polyline(pts, { color: light ? '#14232b' : '#ffffff', weight: 8, opacity: .8, interactive: false }).addTo(layer);
  L.polyline(pts, { color: k.rail, weight: 4.5, opacity: op, interactive: false }).addTo(layer);
}
function colorInfo(c, line = '') {
  if (String(line).trim() === '1') return { c: '#ffffff', ink: '#14232b', rail: '#ffffff', contrast: '#14232b' };
  const col = /^#[0-9a-f]{6}$/i.test(c || '') ? c : '#0a6c8c', ink = contrast(col);
  return { c: col, ink, rail: col, contrast: ink };
}
const badge = (line, color, src, extra = '') => {
  const k = colorInfo(color, line);
  return `<div class="bus${src === 'aut' ? ' aut' : ''}${extra}" style="--c:${k.c};--t:${k.ink};--b:${k.ink}">${esc(line)}</div>`;
};
const busHtml = v => badge(v.line, v.color, v.src, `${mode === 'sched' ? ' sched' : ''}${v.id === selVeh ? ' sel' : ''}`);
const tip = v => esc(`${vehIcon(v.src, v.label)} ${v.line}${v.headsign ? ' → ' + v.headsign : ''}${v.label ? ' · ' + vehName(v.src, v.label) : ''}`);

// ETICHETTE DI STATO DEL PASSAGGIO (una sola funzione per pannello fermata e dettaglio corsa)
//  at = fermo in fermata · departing = sta partendo · approaching = in arrivo · altrimenti conto alla rovescia in minuti
function etaText(phase, expMs, inMin, live = true) {
  if (live) {
    if (phase === 'at') return 'In fermata';
    if (phase === 'departing') return 'In partenza';
    if (phase === 'approaching') return 'In arrivo';
    if (phase === 'arrived') return 'Arrivato';

// aggiorna ogni secondo i "tra N min" senza aspettare il server
setInterval(() => document.querySelectorAll('[data-exp]').forEach(el => {

const ptHtml = (l, sm) => `<span class="pt${sm ? ' sm' : ''}">${esc((l || '').toUpperCase())}</span>`;
const norm = s => s.toLowerCase().replace(/"/g, '').replace(/f\.te\b/g, 'fondamente').replace(/p\.le\b/g, 'piazzale').replace(/\bs\.\s*/g, 'san ').replace(/\s+/g, ' ').trim();
const LETTER = /^(.*?)\s*(?:"([^"]+)"|\bCORSIA\s+([A-Z0-9]+)|\s([A-Z]\d{1,2}))\s*$/i;
const ALIAS = { 'favretti mestre fs': 'stazione mestre fs' };
const nice = n => n === n.toUpperCase() && /[A-Z]/.test(n) ? n.toLowerCase().replace(/(^|[\s'-])(\p{L})/gu, (_, a, b) => a + b.toUpperCase()) : n;
const ZONE_M = 300;
const meters = (a, b) => Math.hypot((a.lat - b.lat) * 111000, (a.lon - b.lon) * 78000);

let zones = new Map(), zoneOf = new Map(), snorm = new Map();

function buildZones() {
  const byName = new Map(); snorm = new Map();
  for (const [id, name, lat, lon, src] of stops) {
    snorm.set(id, norm(name));
    const strip = x => x.replace(/\s+A RICHIEST\w*\s*$/i, '').trim(), m = LETTER.exec(name), base = strip(m ? m[1] : name), n = norm(base), key = src + '|' + (ALIAS[n] || n);
    let l = byName.get(key); if (!l) byName.set(key, l = []);
    l.push({ id, name: base, full: strip(name), src, letter: m ? (m[2] || m[3] || m[4]).toUpperCase() : '', lat, lon });
  }
  const cmp = (a, b) => (!a) - (!b) || a.localeCompare(b, 'it', { numeric: true });
  const assign = (c, codes) => {
    const pk = i => i.lat.toFixed(5) + ',' + i.lon.toFixed(5), places = new Map();
    for (const i of c) if (!(codes && i.letter) && !places.has(pk(i))) places.set(pk(i), String(places.size + 1));
    for (const i of c) i.label = (codes && i.letter) || (places.size >= 2 ? places.get(pk(i)) : '');
    return [...new Set(c.map(i => i.label))].sort(cmp);
  };
  zones = new Map(); zoneOf = new Map();
  for (const items of byName.values()) {
    const cl = [];
    for (const it of items) {
      let cur = [it];
      for (let k = cl.length - 1; k >= 0; k--) if (cl[k].some(o => meters(o, it) <= ZONE_M)) cur = cur.concat(cl.splice(k, 1)[0]);
      cl.push(cur);
    }
    for (const c of cl) {
      if (c.length < 2) continue;
      c.sort((a, b) => a.id.localeCompare(b.id, 'it', { numeric: true }));
      let letters = assign(c, true), name = c[0].name;
      if (letters.length < 2) { letters = assign(c, false); name = c[0].full; }
      if (letters.length < 2) continue;
      const z = { key: c[0].id, name: nice(name), src: c[0].src, items: c, pick: '*', letters,
        letterOf: new Map(c.map(i => [i.id, i.label])),
        center: [c.reduce((s, i) => s + i.lat, 0) / c.length, c.reduce((s, i) => s + i.lon, 0) / c.length] };
      z.norm = norm(z.name);
      zones.set(z.key, z); for (const i of c) zoneOf.set(i.id, z);

}

const isStopSelected = id => {

};

// MOVIMENTO DEI MEZZI (fedele ai dati ricevuti)
// Regole: 1) la posizione vera è sempre l'ultimo rilevamento GPS; 2) il mezzo non va MAI oltre l'ultimo punto ricevuto
// (nessuna previsione: in laguna e in calle una proiezione in rettilineo darebbe posizioni inventate);
// 3) tra due rilevamenti percorre il tratto di linea inviato dal server (v.path, già agganciato al tracciato), a velocità
// costante e calibrata perché arrivi quando è atteso il rilevamento successivo; senza tracciato, va in linea retta fra i due punti.
// Il ritardo visivo è circa un intervallo di aggiornamento del feed: è il prezzo per non mostrare posizioni false.
const markers = new Map();
const SNAP_M = 300;        // distanza oltre la quale il marker salta direttamente (cambio corsa, riconnessione)
const MAX_MPS = 30;        // limite di velocità visiva (108 km/h): evita scatti se si accumula ritardo
const mDist = (aLat, aLon, bLat, bLon) => Math.hypot((aLat - bLat) * 111000, (aLon - bLon) * 78000);
const polyLen = p => { let L = 0; for (let i = 1; i < p.length; i++) L += mDist(p[i - 1][0], p[i - 1][1], p[i][0], p[i][1]); return L; };

function render() {
  const keep = new Set(), now = performance.now();
  for (let i = 0; i < vehicles.length; i++) {
    const v = vehicles[i];
    if (!active.has(v.src) || !Number.isFinite(v.lat) || !Number.isFinite(v.lon)) continue;
    keep.add(v.id);
    const html = busHtml(v);
    let e = markers.get(v.id);

    if (!e) {   // nuovo mezzo
      const m = L.marker([v.lat, v.lon], { icon: L.divIcon({ className: 'bus-marker', iconSize: null, html }) })
        .bindTooltip(tip(v), { direction: 'top', offset: [0, -12] }).addTo(map), id = v.id;
      m.on('click', () => { const c = vehicles.find(x => x.id === id); if (c) openTripPanel(c); });
      markers.set(v.id, { m, html, tipContent: tip(v), lat: v.lat, lon: v.lon, poly: [[v.lat, v.lon]], mps: 0, lastTs: v.ts || 0, lastArr: now, iv: POLL_MS * 2 });
      continue;
    }
    if (e.html !== html) { e.m.setIcon(L.divIcon({ className: 'bus-marker', iconSize: null, html })); e.html = html; }
    const newTip = tip(v);
    if (e.tipContent !== newTip) { e.m.setTooltipContent(newTip); e.tipContent = newTip; }

    if (mode !== 'live') { e.lat = v.lat; e.lon = v.lon; e.poly = [[v.lat, v.lon]]; e.m.setLatLng([v.lat, v.lon]); continue; }   // orario: posizione diretta

    // nuovo rilevamento? (si confronta col punto finale del percorso già in coda)
    const end = e.poly[e.poly.length - 1];
    if (mDist(end[0], end[1], v.lat, v.lon) < 3) continue;           // entro il rumore GPS: fermo
    if (mDist(e.lat, e.lon, v.lat, v.lon) > SNAP_M) { e.lat = v.lat; e.lon = v.lon; e.poly = [[v.lat, v.lon]]; e.m.setLatLng([v.lat, v.lon]); e.lastTs = v.ts || 0; e.lastArr = now; continue; }

    const dFeed = v.ts && e.lastTs ? v.ts - e.lastTs : 0, dArr = now - e.lastArr;

    e.lastTs = v.ts || e.lastTs; e.lastArr = now;

    if (!pts.length || mDist(pts[pts.length - 1][0], pts[pts.length - 1][1], v.lat, v.lon) > 3) pts.push([v.lat, v.lon]);

let lastFrame = performance.now();
requestAnimationFrame(function frame(t) {
  const dt = Math.min(100, t - lastFrame); lastFrame = t;

    for (const e of markers.values()) {
      if (e.poly.length < 2) continue;                                  // arrivato: nessun lavoro
      let adv = e.mps * dt / 1000;                                      // metri da percorrere in questo fotogramma
      while (adv > 0 && e.poly.length > 1) {
        const a = e.poly[0], b = e.poly[1], seg = mDist(a[0], a[1], b[0], b[1]);
        if (adv >= seg) { adv -= seg; e.poly.shift(); }
        else { const f = adv / seg; e.poly[0] = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; adv = 0; }
      }
      e.lat = e.poly[0][0]; e.lon = e.poly[0][1];
      e.m.setLatLng([e.lat, e.lon]);
    }
  }
  requestAnimationFrame(frame);
});

async function load() {
  const m = mode, key = keyOf();
  try {
    const d = await (await fetch(`/api/${m === 'sched' ? 'scheduled' : 'vehicles'}?src=${key}${schedQS()}`, { cache: 'no-store' })).json();
    if (m !== mode || key !== keyOf()) return;
    if (d.version !== undefined && d.version !== staticVer) { staticVer = d.version; loadStatics(); }
    vehicles = d.vehicles || []; lastUpdate = d.updated || Date.now(); render();
    if (d.error) throw new Error(d.error);
    const wait = [...active].filter(s => d.ready && !d.ready[s]);
    statusEl.className = '';
    statusEl.textContent = `${[...active].map(s => `${ICON[s]}${vehicles.filter(v => v.src === s).length}`).join(' · ')} ${m === 'sched' ? 'pianificato' : 'mezzi'} · ${new Date(d.updated).toLocaleTimeString('it-IT')}`
      + (wait.length ? ` · in caricamento: ${wait.join(', ')}` : '');
  } catch (e) { if (m === mode) { statusEl.className = 'err'; statusEl.textContent = 'Errore: ' + e.message; } }
}

function drawStops() {
  stopLayer.clearLayers();
  const near = map.getZoom() >= MIN_STOP_ZOOM;

  const b = map.getBounds().pad(.1); let n = 0;
  for (let i = 0; i < stops.length; i++) {
    const s = stops[i];
    const [id, name, lat, lon, src] = s;
    if (!active.has(src) || !b.contains([lat, lon])) continue;
    if (++n > 2500) break;
    const selected = isStopSelected(id);
    L.circleMarker([lat, lon], {
      radius: selected ? 9 : 6,
      weight: selected ? 2.5 : 1.5,
      color: '#0f172a',
      fillColor: selected ? '#f5a623' : '#ffffff',
      fillOpacity: 0.95
    }).bindTooltip(`${ICON[src]} ${esc(name)}`).on('click', () => openStopOrZone(id, name, src)).addTo(stopLayer);
  }
}
map.on('moveend', drawStops);

const refreshPanel = () => { if (openStop) loadDepartures(); else if (openTrip) loadTrip(); };
const startPanelTimer = () => { clearInterval(panelTimer); panelTimer = setInterval(() => { if (Date.now() - lastPushAt > 6000) refreshPanel(); }, 4000); };   // rete di sicurezza se lo stream non arriva
function resetTrip() {

async function loadDepartures() {
  const id = openStop; if (!id) return;
  try {
    const d = await (await fetch(`${openZone ? '/api/zone?ids=' : '/api/stop?id='}${encodeURIComponent(id)}${schedQS()}`, { cache: 'no-store' })).json();
    if (d.error) throw new Error(d.error);

    lastDeps = d; renderDepartures();
  } catch (e) { if (id === openStop) plist.innerHTML = `<p class="late">Dati non disponibili: ${esc(e.message)}</p>`; }
}

function renderDepartures() {
  if (!lastDeps || !openStop) return;
  const live = mode === 'live', z = openZone;
  psub.textContent = (z ? `${z.letters.length} ${unitOf(z)[1]} · ` : '') + (live ? `Live · ${new Date(lastDeps.liveUpdated).toLocaleTimeString('it-IT')}` : 'Orario') + (lastDeps.note ? ` · ${lastDeps.note}` : '');
  
  const base = lastDeps.departures.map(x => ({ ...x, tIn: live ? x.expIn : x.schedIn }))
    .filter(x => !x.arrival && x.tIn >= -30 && x.tIn <= 120 && active.has(x.src || openSrc));
    
  const rows = base.filter(x => !z || z.pick === '*' || z.letterOf.get(x.stop) === z.pick).sort((a, b) => a.tIn - b.tIn).slice(0, z ? 60 : 30);

    + z.letters.map(l => `<button class="chip${z.pick === l ? ' on' : ''}" data-p="${esc(l)}">${ptHtml(l, true)}</button>`).join('')
    + '</div>' : '';
    
  const html = rows.map(x => {
    let cls = '', subNote = '';
    const src = x.src || openSrc;
    
    if (x.cancel) {
      cls = 'late';
      subNote = x.cancel === 'trip' ? 'Soppressa' : 'Saltata';
    } else if (live) {
      if (!x.live) {
        subNote = 'da orario';
      } else if (x.delay >= 1) {

        subNote = `in ritardo di ${x.delay} min`;
      } else if (x.delay <= -1) {

        subNote = 'in orario';

    }

    const vName = (live && x.vehicle) ? vehName(src, x.vehicle) : '';
    
    let infoLine = subNote;

    const timeDisplayHtml = (live && Math.abs(x.delay) >= 1)
      ? `<div class="dt-time-wrap"><span class="sched-crossed">${esc(x.sched)}</span><strong class="${cls}">${esc(x.exp)}</strong></div>`
      : `<div class="dt-time-wrap"><strong class="${cls}">${esc(live ? x.exp : x.sched)}</strong></div>`;

      + `${badge(x.line, x.color, src)}`

      + `<div class="dt">${timeDisplayHtml}<div class="in-min ${cls}" data-exp="${live && x.expMs ? Math.round(x.expMs) : ''}" data-ph="${live ? (x.phase || '') : ''}">${minText}</div></div></div>`;
  }).join('');
  
  plist.innerHTML = html || '<p class="muted" style="text-align:center;padding:1rem">Nessun passaggio.</p>';
}

function openTripPanel(v, back = null) {

async function loadTrip() {

}
function tripHtml(d) {
  const k = colorInfo(d.trip.color, d.trip.line), n = d.stops.length;
  const rows = d.stops.map((s, i) => {
    let timeHtml = '', sub = '';
    if (d.live && s.delay != null) {
      const [c, t] = [s.delay >= 1 ? 'late' : s.delay <= -1 ? 'early' : 'ok', s.delay >= 1 ? `in ritardo di ${s.delay} min` : s.delay <= -1 ? `in anticipo di ${-s.delay} min` : 'in orario'];
      sub = t;
      timeHtml = (Math.abs(s.delay) >= 1)
        ? `<div class="tm-time-wrap"><span class="sched-crossed">${esc(s.sched)}</span><strong class="${c}">${esc(s.exp)}</strong></div>`
        : `<div class="tm-time-wrap"><strong class="${c}">${esc(s.exp)}</strong></div>`;
    } else {
      sub = d.live ? 'da orario' : '';
      timeHtml = `<div class="tm-time-wrap"><strong>${esc(s.sched)}</strong></div>`;
    }
    const meta = s.skipped ? 'Fermata saltata' : (s.state === 'at' || s.state === 'next') ? etaText(s.phase, s.expMs, s.inMin, d.live) : (s.state === 'upcoming' && d.live && s.expMs ? `tra ${Math.max(1, Math.round((s.expMs - Date.now()) / 60000))} min` : '');
    const isFirst = i === 0 ? ' first' : '', isLast = i === n - 1 ? ' last' : '';
    return `<div class="st ${s.state}${s.skipped ? ' cx' : ''}${isFirst}${isLast}" data-i="${i}" role="button" tabindex="0">`
      + `<div class="rail-col"><div class="rail-line"></div><span class="dot">${s.state === 'passed' ? '✓' : ''}</span></div>`
      + `<div class="sn"><div class="nm">${esc(s.name)}</div>${meta ? `<div class="muted">${meta}</div>` : ''}</div>`
      + `<div class="tm">${timeHtml}<div class="muted">${sub}</div></div></div>`;
  }).join('');
  const weak = lum(k.rail) > .8 || lum(k.rail) < .03;   // bianco o nero puro non si vedono su uno dei due temi: si usa il colore del testo
  return `<div class="tl" style="--rc:${weak ? 'var(--fg)' : k.rail};--check-fg:${weak ? 'var(--bg)' : k.contrast}"><div class="trav"></div><div class="veh">${vehIcon(d.trip.src, d.trip.vehicle)}</div>${rows}</div>`;
}

function placeVehicle(d, first) {
  const tl = plist.querySelector('.tl'), veh = tl && tl.querySelector('.veh'), trav = tl && tl.querySelector('.trav');
  if (!tl || !veh || !trav) return;

  const rows = tl.querySelectorAll('.st'), a = rows[d.progress.from], b = rows[d.progress.from + 1];
  if (!a) { veh.style.display = 'none'; trav.style.display = 'none'; return; }
  veh.style.display = '';
  trav.style.display = '';

  const tlRect = tl.getBoundingClientRect();
  const dotCenter = row => {
    const dot = row.querySelector('.dot');
    const r = dot.getBoundingClientRect();
    return {
      x: r.left - tlRect.left + r.width / 2,
      y: r.top - tlRect.top + r.height / 2
    };
  };

  const firstCenter = dotCenter(rows[0]);
  const ca = dotCenter(a).y;
  const cb = b ? dotCenter(b).y : ca;
  const y = ca + (cb - ca) * (b ? d.progress.frac : 0);

  veh.style.left = firstCenter.x + 'px';
  trav.style.left = firstCenter.x + 'px';
  trav.style.top = firstCenter.y + 'px';

  const from = !first && vehMemo.trip === openTrip.tripId ? vehMemo.y : y;
  veh.style.transition = trav.style.transition = 'none';
  veh.style.top = from + 'px';
  trav.style.height = Math.max(0, from - firstCenter.y) + 'px';
  void veh.offsetHeight;
  veh.style.transition = trav.style.transition = '';
  veh.style.top = y + 'px';
  trav.style.height = Math.max(0, y - firstCenter.y) + 'px';
  vehMemo = { trip: openTrip.tripId, y };
}

function renderTrip(first) {
  const d = lastTrip; if (!d || !openTrip) return;
  let status = 'programmato';
  if (d.live) status = d.delayNow == null ? 'live' : d.delayNow >= 1 ? `<span class="late">in ritardo di ${d.delayNow} min</span>`
    : d.delayNow <= -1 ? `<span class="early">in anticipo di ${Math.abs(d.delayNow)} min</span>` : '<span class="ok">in orario</span>';
  pname.textContent = d.trip.headsign ? `→ ${d.trip.headsign}` : `→ Linea ${d.trip.line}`;
  const o = d.stops[0];
  psub.innerHTML = (openTrip.back ? `<a href="#" id="pback">← ${esc(openTrip.back.name)}</a><br>` : '')
    + (o ? `da ${esc(o.name)}${o.sched ? ', ' + o.sched : ''}` : '') + (d.note ? `<br>${esc(d.note)}` : '');
  pstatus.innerHTML = `${status} · ${vehName(d.trip.src, d.trip.vehicle || openTrip.label)}${d.live && d.speedKmh != null ? ` · ${d.speedKmh} km/h` : ''}${d.others?.length ? ` · insieme a ${d.others.map(esc).join(', ')}` : ''}`;
  plist.innerHTML = (d.cancelled ? '<div class="banner">Corsa soppressa</div>' : '') + tripHtml(d)
    + (d.live && d.historyKnown ? '<p class="muted" style="margin-top:.4rem">Fermate passate: ultima stima.</p>' : '');
  placeVehicle(d, first);
  if (!first) return;
  routeToken++; lineLayer.clearLayers(); tripLayer.clearLayers();
  const k = colorInfo(d.trip.color, d.trip.line);
  if (d.shape?.length) drawLine(d.shape, k, lineLayer, .95);
  else showRoutes([openTrip.routeId]);
  for (let i = 0; i < d.stops.length; i++) {
    const s = d.stops[i];
    if (s.lat != null) L.circleMarker([s.lat, s.lon], { radius: 3.5, weight: 1.5, color: '#0f172a', fillColor: '#fff', fillOpacity: .9 }).bindTooltip(esc(s.name)).addTo(tripLayer);
  }
  const veh = plist.querySelector('.veh'), row = veh && veh.style.display !== 'none' ? veh : plist.querySelector('.st.at, .st.next');
  if (row) row.scrollIntoView({ block: 'center' });
}
chipsArea.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip && openZone) {
    openZone.pick = chip.dataset.p;
    drawStops();
    return renderDepartures();
  }
});
plist.addEventListener('click', e => {
  const dep = e.target.closest('.dep.go');
  if (dep && openStop) return followDeparture(dep.dataset.trip, dep.dataset.src, dep.dataset.stop, dep.dataset.veh);
  const row = e.target.closest('.st'); if (!row || !lastTrip) return;
  const s = lastTrip.stops[+row.dataset.i];
  if (s && s.lat != null) map.flyTo([s.lat, s.lon], Math.max(map.getZoom(), 15));
});

function setFollow(on) { follow = on; followEl.hidden = !on; }
function followTarget(ll, z) {
  // il pannello copre una parte della mappa (a sinistra su schermi larghi, in basso su telefono): il mezzo seguito resta nella parte libera
  const p = map.project(ll, z), phone = window.innerWidth <= 640;
  return map.unproject(p.add(phone ? [0, map.getSize().y * .22] : [-((panel.hidden ? 0 : panel.offsetWidth) + 12) / 2, 0]), z);
}
function followDeparture(tripId, src, stop, veh) {
  src = src || openSrc;
  const x = lastDeps && lastDeps.departures.find(d => d.tripId === tripId && (d.src || openSrc) === src && (!stop || d.stop === stop) && (!veh || (d.veh || '') === veh)); if (!x) return;
  const back = { id: openStop, name: openStopName, src: openSrc, zone: openZone };
  const v = (veh && vehicles.find(c => c.src === src && c.key === veh))
    || vehicles.find(c => c.src === src && c.tripId === tripId && !c.co)
    || { id: null, src, tripId, routeId: null, line: x.line, label: x.vehicle, headsign: x.headsign, color: x.color };
  openTripPanel(v, back);
  if (!v.id) return;
  const e = markers.get(v.id), ll = e ? e.m.getLatLng() : L.latLng(v.lat, v.lon), z = Math.max(map.getZoom(), 15);
  setFollow(true); followAfter = Date.now() + 1200;
  map.flyTo(followTarget(ll, z), z, { duration: .8 });
}
setInterval(() => {
  if (!follow || !selVeh || Date.now() < followAfter) return;
  const e = markers.get(selVeh), c = vehicles.find(x => x.id === selVeh), ll = e ? e.m.getLatLng() : c && L.latLng(c.lat, c.lon);
  if (ll) map.panTo(followTarget(ll, map.getZoom()), { animate: true, duration: 1, easeLinearity: 1 });
}, 1000);
map.on('dragstart', () => setFollow(false));
followEl.onclick = () => setFollow(false);

let me = null;
$('locate').onclick = () => map.locate({ setView: true, maxZoom: 16 });
map.on('locationfound', e => {
  if (me) me.remove();
  me = L.circleMarker(e.latlng, { radius: 6, color: '#fff', weight: 2, fillColor: '#0284c7', fillOpacity: 1 }).addTo(map);
});
map.on('locationerror', () => { statusEl.className = 'err'; statusEl.textContent = 'Posizione non disponibile'; });

document.querySelectorAll('input[name=mode]').forEach(el => el.addEventListener('change', () => {
  mode = el.value; vehicles = [];
  const sched = mode === 'sched';
  $('clock-section').style.display = sched ? 'none' : 'flex';
  $('timeline-controls').classList.toggle('active', sched);
  if (sched) applyTime(+range.value, true);
  else { stopPlay(); load(); }
  render(); renderDepartures();
  if (openTrip && openTrip.tripId) loadTrip();
  if (openStop) loadDepartures();
}));
document.querySelectorAll('input[name=src]').forEach(el => el.addEventListener('change', () => {
  if (el.checked) active.add(el.value); else active.delete(el.value);
  if (!active.size) { active.add(el.value); el.checked = true; }
  vehicles = vehicles.filter(v => active.has(v.src));
  render(); drawStops(); load();
}));

// AGGIORNAMENTO A SPINTA: il server avvisa (SSE) appena ci sono dati nuovi, così mezzi e pannelli si aggiornano subito.
// I timer restano come rete di sicurezza e scattano solo se lo stream tace da oltre 6 s. Massimo un aggiornamento ogni 600 ms.
let lastPushAt = 0, lastPushRun = 0, pushTimer = null;
function onPush(changed) {
  lastPushAt = Date.now();
  if (document.hidden || mode !== 'live') return;
  const wait = 600 - (Date.now() - lastPushRun);
  if (wait > 0) { if (!pushTimer) pushTimer = setTimeout(() => { pushTimer = null; onPush(changed); }, wait); return; }
  lastPushRun = Date.now();
  if (changed) load();
  if (typeof refreshPanel === 'function') refreshPanel();
}
try { const es = new EventSource('/api/stream'); es.onmessage = e => onPush(e.data === '1'); } catch (e) { /* si usano i timer */ }
// =====================================================================================================
// TEMA · MAREA · INSTALLAZIONE · ACCESSIBILITÀ DA TASTIERA
// =====================================================================================================
const root = document.documentElement, themeBtn = $('theme-btn'), tideBtn = $('tide-btn'), tideEl = $('tide'), tideBody = $('tide-body');
const narrow = () => matchMedia('(max-width: 759px)').matches;   // sotto questa larghezza le finestre sono mutuamente esclusive (non si sovrappongono)
syncPlay();
new ResizeObserver(() => map.invalidateSize({ animate: false })).observe($('wrap'));   // il dock cambia altezza (es. in modalità Pianificato): la mappa si adegua

// ---------- TEMA CHIARO / SCURO ----------
function applyTheme(t, save) {
  root.dataset.theme = t; themeBtn.setAttribute('aria-pressed', String(t === 'dark'));
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'dark' ? '#121a28' : '#ffffff';
  if (save) { try { localStorage.setItem('theme', t); } catch { /* navigazione privata */ } }
}
themeBtn.setAttribute('aria-pressed', String(root.dataset.theme === 'dark'));
themeBtn.onclick = () => applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark', true);
// pulsante "cancella" della ricerca (visibile solo se c'è testo)
const clearBtn = $('search-clear');
filterEl.addEventListener('input', () => { clearBtn.hidden = !filterEl.value; });
clearBtn.onclick = () => { filterEl.value = ''; filterEl.dispatchEvent(new Event('input')); filterEl.focus(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', e => {      // finché l'utente non sceglie, si segue il sistema
  try { if (localStorage.getItem('theme')) return; } catch { /* ignora */ }
  applyTheme(e.matches ? 'dark' : 'light');
});

// ---------- FINESTRE: una alla volta su schermi stretti ----------
function collapseSearch() { searchContainer.classList.remove('expanded'); searchToggleBtn.setAttribute('aria-expanded', 'false'); resultsEl.classList.remove('active'); }
function onPanelOpen() { document.body.classList.add('has-panel'); if (narrow()) closeTide(); }
function onPanelClose() { document.body.classList.remove('has-panel'); }
map.on('click', () => { if (narrow()) closeTide(); });

// ---------- MAREA ----------
let tideData = null, tideErr = null, tideTimer = null;
const fmtCm = cm => `${cm > 0 ? '+' : cm < 0 ? '−' : ''}${Math.abs(cm)}`;
const hm = ms => new Date(ms).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
const dayTag = ms => { const a = new Date(ms), b = new Date(); return a.toDateString() === b.toDateString() ? '' : a.toLocaleDateString('it-IT', { weekday: 'short' }) + ' '; };
function spark(h) {   // andamento delle ultime ore, con descrizione testuale per chi non vede il grafico
  if (!h || h.length < 3) return '';
  const W = 300, H = 64, P = 7, x0 = h[0][0], x1 = h[h.length - 1][0], ys = h.map(p => p[1]), lo = Math.min(...ys), span = Math.max(Math.max(...ys) - lo, 10);
  const X = t => P + (W - 2 * P) * (t - x0) / Math.max(1, x1 - x0), Y = v => H - P - (H - 2 * P) * (v - lo) / span;
  const d = h.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(''), mins = Math.round((x1 - x0) / 60000), last = h[h.length - 1];
  return `<svg class="tide-spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento delle ultime ${mins >= 90 ? Math.round(mins / 60) + ' ore' : mins + ' minuti'}: da ${fmtCm(h[0][1])} a ${fmtCm(last[1])} centimetri"><path d="${d}"/><circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="5"/></svg>`;
}
function renderTide() {
  const d = tideData;
  if (!d) { tideBody.innerHTML = tideErr ? `<p class="tide-note">Dati di marea non disponibili: ${esc(tideErr)}</p>` : 'Caricamento…'; return; }
  const t = d.trend;
  const tr = !t ? { icon: 'steady', txt: 'Tendenza in calcolo…' }
    : t.dir === 'up' ? { icon: 'up', txt: `In crescita${t.rate != null ? ` · +${Math.abs(t.rate)} cm/h` : ''}` }
    : t.dir === 'down' ? { icon: 'down', txt: `In calo${t.rate != null ? ` · −${Math.abs(t.rate)} cm/h` : ''}` }
    : { icon: 'steady', txt: 'Stazionaria' };
  const next = (d.next || []).map(n => `<li><b>${n.type === 'max' ? 'Alta' : 'Bassa'}</b><span class="v">${fmtCm(n.cm)} cm · ${dayTag(n.ts)}${hm(n.ts)}</span></li>`).join('');
  tideBody.innerHTML = `<div class="tide-level"><span class="num">${fmtCm(d.cm)}</span><span class="unit">cm</span></div>`
    + `<div class="tide-cat" data-cat="${esc(d.category.key)}">${esc(d.category.label)}</div>`
    + `<div class="tide-trend"><svg class="ic" aria-hidden="true"><use href="#i-${tr.icon}"/></svg><span>${tr.txt}${t && t.basis === 'previsione' ? ' <span class="muted">(da previsione)</span>' : ''}</span></div>`
    + (d.stale ? `<p class="tide-note" role="status">Ultimo dato di ${d.ageMin} minuti fa: potrebbe non essere aggiornato.</p>` : '')
    + (next ? `<ul class="tide-next" aria-label="Prossime alte e basse maree previste">${next}</ul>` : '')
    + spark(d.history)
    + `<p class="tide-foot">${esc(d.station)} · rilevato alle ${hm(d.ts)}. Livello sullo zero mareografico di Punta della Salute; dati grezzi, non validati.<br>Fonte (licenza ${esc(d.source.license)}):<a href="${esc(d.source.url)}" target="_blank" rel="noopener">${esc(d.source.name)}</a></p>`;
  tideBtn.querySelector('.dotc').dataset.cat = d.category.key;
  const label = `Marea a Venezia: ${fmtCm(d.cm)} cm, ${d.category.label.toLowerCase()}${t ? ', ' + tr.txt.split(' · ')[0].toLowerCase() : ''}`;
  tideBtn.setAttribute('aria-label', label); tideBtn.title = label;
}
async function loadTide() {
  try { const d = await (await fetch('/api/tide', { cache: 'no-store' })).json(); if (d.error) throw new Error(d.error); tideData = d; tideErr = null; }
  catch (e) { tideErr = e.message; }
  renderTide(); if (!tideEl.hidden) positionTide();
}
function positionTide() {   // la scheda si allinea al suo pulsante, senza uscire dalla mappa
  const w = $('wrap').getBoundingClientRect(), b = tideBtn.getBoundingClientRect(), h = tideEl.offsetHeight, g = 12;
  tideEl.style.top = Math.max(g, Math.min(b.top - w.top - 8, w.height - h - g)) + 'px';
}
function openTide() {
  if (narrow() && !panel.hidden) closePanel();
  collapseSearch();
  tideEl.hidden = false; tideBtn.setAttribute('aria-expanded', 'true'); renderTide(); positionTide(); tideEl.focus({ preventScroll: true });
  loadTide(); clearInterval(tideTimer); tideTimer = setInterval(loadTide, 60000);
}
function closeTide() { if (tideEl.hidden) return; tideEl.hidden = true; tideBtn.setAttribute('aria-expanded', 'false'); clearInterval(tideTimer); }
tideBtn.onclick = () => (tideEl.hidden ? openTide() : closeTide());
$('tide-close').onclick = () => { closeTide(); tideBtn.focus(); };
window.addEventListener('resize', () => { if (!tideEl.hidden) positionTide(); });
loadTide(); setInterval(() => { if (!document.hidden && tideEl.hidden) loadTide(); }, 300000);   // aggiorna anche il punto colorato sul pulsante

// ---------- INSTALLAZIONE COME APP ----------
// Chrome/Edge/Android: l'evento beforeinstallprompt abilita il pulsante (e il browser mostra anche la sua icona "Installa" nella barra).
// iPhone/iPad (Safari) non hanno l'evento: si mostrano le istruzioni "Condividi > Aggiungi alla schermata Home".
const installBtn = $('install-btn'), snack = $('snack');
let installEvt = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const snoozed = () => { try { return +localStorage.getItem('installSnooze') > Date.now(); } catch { return false; } };
const snooze = () => { try { localStorage.setItem('installSnooze', String(Date.now() + 14 * 864e5)); } catch { /* ignora */ } };
const syncInstall = () => { installBtn.hidden = standalone() || !(installEvt || iOS); };
function showSnack(ios) {
  $('snack-text').innerHTML = ios ? 'Su iPhone e iPad: tocca <svg class="ic sm" aria-hidden="true"><use href="#i-share"/></svg> <b>Condividi</b>, poi <b>Aggiungi alla schermata Home</b>.'
    : "Installa l'app sul telefono: si apre più in fretta, a schermo intero.";
  $('snack-install').hidden = ios; snack.hidden = false; clearTimeout(showSnack.t); showSnack.t = setTimeout(() => { snack.hidden = true; }, 20000);
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; syncInstall(); if (!snoozed() && !standalone()) showSnack(false); });
window.addEventListener('appinstalled', () => { installEvt = null; snack.hidden = true; syncInstall(); });
async function doInstall() {
  if (installEvt) { snack.hidden = true; installEvt.prompt(); const r = await installEvt.userChoice.catch(() => null); installEvt = null; syncInstall(); if (r && r.outcome === 'dismissed') snooze(); }
  else if (iOS) showSnack(true);
}
installBtn.onclick = doInstall; $('snack-install').onclick = doInstall;
$('snack-close').onclick = () => { snack.hidden = true; snooze(); };
matchMedia('(display-mode: standalone)').addEventListener?.('change', syncInstall);
syncInstall();
if (iOS && !standalone() && !snoozed()) setTimeout(() => showSnack(true), 4000);   // un solo suggerimento, poi 14 giorni di pausa
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('/sw.js').catch(() => { /* l'app funziona anche senza */ });

// ---------- TASTIERA ----------
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {   // chiude la finestra più "in alto": marea, poi ricerca, poi pannello
    if (!tideEl.hidden) { const inside = tideEl.contains(document.activeElement); closeTide(); if (inside) tideBtn.focus(); }
    else if (searchContainer.classList.contains('expanded')) { setSearch(false); searchToggleBtn.focus(); }
    else if (!panel.hidden) closePanel();
  } else if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.dep.go,.st,.search-item')) { e.preventDefault(); e.target.click(); }   // righe cliccabili anche da tastiera
});

drawStops(); updateClock(); load(); setInterval(() => { if (Date.now() - lastPushAt > 6000) load(); }, POLL_MS);
</script>
</body>
</html>
