name: Keep Render Alive

on:
  schedule:
    # Esegue il ping ogni 10 minuti per evitare lo stop del server per inattività
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permette di avviarlo manualmente anche dalla scheda "Actions" di GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Render
        run: |
          curl -I https://veneziatpl.onrender.com/
