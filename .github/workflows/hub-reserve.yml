name: Hub reserve regression
on:
  push:
    branches: [main, 'feature/meteo-hub-fallback','feature/hub-continuity','feature/hub-audit']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/hub-reserve.test.js tests/hub-history.test.js tests/tide.test.js tests/tide-fonti.test.js tests/meteo.test.js tests/mose.test.js tests/cpsm-web-forecast.test.js tests/security.test.js
      - run: node --test tests/alexa-lambda.test.js tests/alexa-dialogo.test.js tests/alexa-modello.test.js tests/alexa-skill.test.js tests/alexa-meteo.test.js tests/alexa-unita.test.js
