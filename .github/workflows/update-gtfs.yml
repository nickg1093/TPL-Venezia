name: Aggiorna GTFS ACTV

on:
  schedule:
    # Esegue ogni 15 minuti per tenere sveglio Render e controllare i GTFS
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sveglia Server Render (Keep-Alive)
        run: |
          echo "Invio richiesta di risveglio a Render..."
          # Tenta di contattare il server, riprova se va in timeout (utile se Render è spento)
          curl -s --retry 3 --retry-delay 10 --max-time 60 https://veneziatpl.onrender.com/ > /dev/null || true
          echo "Richiesta di keep-alive completata."

      - name: Scarica e verifica i GTFS ACTV
        run: |
          mkdir -p data
          UPDATED=0

          declare -A urls=(
            ["actv_nav"]="https://actv.avmspa.it/sites/default/files/attachments/opendata/navigazione/actv_nav.zip"
            ["actv_aut"]="https://actv.avmspa.it/sites/default/files/attachments/opendata/automobilistico/actv_aut.zip"
          )

          for name in "${!urls[@]}"; do
            url="${urls[$name]}"
            target="data/$name.zip"
            tmp="data/$name.tmp.zip"

            echo "=== Scarico $name ==="
            
            curl -s -L --retry 3 --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$url" -o "$tmp"
            
            echo "Dimensione file scaricato: $(wc -c < "$tmp") bytes"

            if [ -s "$tmp" ] && head -c 2 "$tmp" | grep -q "PK"; then
              echo "Il file scaricato è uno ZIP valido."
              
              if [ -f "$target" ]; then
                old_hash=$(md5sum "$target" | awk '{print $1}')
                new_hash=$(md5sum "$tmp" | awk '{print $1}')

                if [ "$old_hash" != "$new_hash" ]; then
                  mv "$tmp" "$target"
                  UPDATED=1
                  echo ">>> ESITO: Il file $name è diverso! Aggiornato con successo."
                else
                  echo ">>> ESITO: Il file $name è identico a quello attuale."
                  rm -f "$tmp"
                fi
              else
                mv "$tmp" "$target"
                UPDATED=1
                echo ">>> ESITO: Primo salvataggio per $name."
              fi
            else
              echo ">>> ERRORE: Il file scaricato non è un archivio ZIP valido."
              rm -f "$tmp"
            fi
          done

          echo "HAS_CHANGES=$UPDATED" >> $GITHUB_ENV

      - name: Commit e Push se ci sono modifiche nei GTFS
        if: env.HAS_CHANGES == '1'
        run: |
          git config user.name "Bot Aggiornamento GTFS"
          git config user.email "bot@actions.github.io"
          git add data/*.zip
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico file GTFS ACTV ($(date +'%Y-%m-%d %H:%M'))"
            git push
            echo "Modifiche GTFS salvate e inviate con successo!"
          fi
