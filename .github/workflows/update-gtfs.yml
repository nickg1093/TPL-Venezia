name: Aggiorna GTFS ACTV

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica e verifica i GTFS ACTV con Debug
        run: |
          mkdir -p data
          UPDATED=0

          declare -A urls=(
            ["actv_nav"]="https://actv.avmspa.it/sites/default/files/attachments/opendata/navigazione/actv_nav.zip"
            ["actv_aut"]="https://actv.avmspa.it/sites/default/files/attachments/opendata/automobilistico/actv_aut.zip"
          )

          for name in "${!urls[@]}"; do
            url="${urls[$name]}"
            target="data/$name.zip"
            tmp="data/$name.tmp.zip"

            echo "=== Controllo $name ==="
            echo "URL: $url"

            # Scarica il file e mostra le intestazioni HTTP per capire se risponde con 200 OK o errori
            curl -i -s -L --retry 3 "$url" -o "$tmp"
            
            echo "Dimensione del file scaricato (bytes):"
            wc -c < "$tmp"

            # Mostra i primi caratteri per capire se è uno ZIP o una pagina HTML di errore
            echo "Primi 5 caratteri del file:"
            head -c 5 "$tmp" || true
            echo ""

            # Verifica che sia un file ZIP valido (Magic Number PK)
            if [ -s "$tmp" ] && head -c 2 "$tmp" | grep -q "PK"; then
              echo "Il file è un archivio ZIP valido."
              
              if [ -f "$target" ]; then
                old_hash=$(md5sum "$target" | awk '{print $1}')
                new_hash=$(md5sum "$tmp" | awk '{print $1}')
                
                echo "Hash vecchio: $old_hash"
                echo "Hash nuovo:   $new_hash"

                if [ "$old_hash" != "$new_hash" ]; then
                  mv "$tmp" "$target"
                  UPDATED=1
                  echo ">>> ESITO: Il file $name è CAMBIATO! Sostituito."
                else
                  echo ">>> ESITO: Il file $name è identico a prima."
                  rm -f "$tmp"
                fi
              else
                mv "$tmp" "$target"
                UPDATED=1
                echo ">>> ESITO: File $name salvato per la prima volta."
              fi
            else
              echo ">>> ERRORE: Il file scaricato NON è un archivio ZIP valido (potrebbe essere una pagina HTML o un errore del server)."
              echo "Contenuto iniziale del file (per debug):"
              head -n 20 "$tmp" || true
              rm -f "$tmp"
            fi
          done

          echo "HAS_CHANGES=$UPDATED" >> $GITHUB_ENV

      - name: Commit e Push se ci sono modifiche nei GTFS
        if: env.HAS_CHANGES == '1'
        run: |
          git config user.name "Bot Aggiornamento GTFS"
          git config user.email "bot@actions.github.io"
          git add data/*.zip
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico file GTFS ACTV ($(date +'%Y-%m-%d %H:%M'))"
            git push
            echo "Modifiche GTFS salvate e inviate con successo!"
          else
            echo "Nessuna differenza rilevata da Git."
          fi
