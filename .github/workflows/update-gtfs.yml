name: Aggiorna GTFS ACTV

on:
  schedule:
    # Esegue ogni 15 minuti per intercettare subito gli aggiornamenti di ACTV e mantenere attivo il server
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sveglia e Mantieni Attivo Server Render
        run: |
          echo "Invio richiesta di risveglio a Render e attendo che si accenda..."
          curl -s --retry 3 --retry-delay 10 --max-time 60 https://veneziatpl.onrender.com/ > /dev/null
          echo "Server Render sveglio e operativo!"

      - name: Scarica e verifica i GTFS ACTV
        run: |
          mkdir -p data
          UPDATED=0

          for f in navigazione/actv_nav automobilistico/actv_aut; do
            NAME=$(basename $f)
            URL="https://actv.avmspa.it/sites/default/files/attachments/opendata/$f.zip"
            TARGET="data/$NAME.zip"
            TMP="data/$NAME.tmp.zip"

            # Scarica solo se il file remoto è più recente di quello locale (-z)
            if [ -f "$TARGET" ]; then
              curl -s -fL -z "$TARGET" "$URL" -o "$TMP"
            else
              curl -s -fL "$URL" -o "$TMP"
            fi

            # Verifica che il file scaricato sia un ZIP valido (Magic Number PK)
            if [ -f "$TMP" ] && [ -s "$TMP" ]; then
              if head -c 2 "$TMP" | grep -q "PK"; then
                mv "$TMP" "$TARGET"
                UPDATED=1
                echo "Nuova versione trovata per $NAME!"
              else
                echo "Attenzione: $NAME.tmp.zip non è un file ZIP valido. Scartato."
                rm -f "$TMP"
              fi
            else
              echo "Nessun aggiornamento per $NAME."
              rm -f "$TMP"
            fi
          done

          echo "HAS_CHANGES=$UPDATED" >> $GITHUB_ENV

      - name: Commit e Push se ci sono modifiche nei GTFS
        if: env.HAS_CHANGES == '1'
        run: |
          git config user.name "Bot Aggiornamento GTFS"
          git config user.email "bot@actions.github.io"
          git add data/*.zip
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico file GTFS ACTV"
            git push
            echo "Modifiche GTFS salvate e inviate con successo!"
          fi
