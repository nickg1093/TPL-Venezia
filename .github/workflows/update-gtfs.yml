name: Aggiorna GTFS ACTV

on:
  schedule:
    # Esegue ogni 2 ore per controllare i nuovi file GTFS
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica e verifica i GTFS ACTV
        run: |
          mkdir -p data
          UPDATED=0

          # Array con i collegamenti diretti e corretti e i relativi nomi file locali
          declare -A urls=(
            ["actv_nav"]="https://actv.avmspa.it/sites/default/files/attachments/opendata/navigazione/actv_nav.zip"
            ["actv_aut"]="https://actv.avmspa.it/sites/default/files/attachments/opendata/automobilistico/actv_aut.zip"
          )

          for name in "${!urls[@]}"; do
            url="${urls[$name]}"
            target="data/$name.zip"
            tmp="data/$name.tmp.zip"

            echo "Controllo $name da: $url"

            # Scarica solo se il file remoto è più recente di quello locale (-z)
            if [ -f "$target" ]; then
              curl -s -fL -z "$target" "$url" -o "$tmp"
            else
              curl -s -fL "$url" -o "$tmp"
            fi

            # Verifica che il file scaricato esista, non sia vuoto e sia uno ZIP valido (Magic Number PK)
            if [ -f "$tmp" ] && [ -s "$tmp" ]; then
              if head -c 2 "$tmp" | grep -q "PK"; then
                mv "$tmp" "$target"
                UPDATED=1
                echo "-> Nuovo aggiornamento scaricato e validato per $name!"
              else
                echo "-> Attenzione: il file scaricato per $name non è uno ZIP valido. Scartato."
                rm -f "$tmp"
              fi
            else
              echo "-> Nessuna modifica remota trovata per $name."
              rm -f "$tmp"
            fi
          done

          echo "HAS_CHANGES=$UPDATED" >> $GITHUB_ENV

      - name: Commit e Push se ci sono modifiche nei GTFS
        if: env.HAS_CHANGES == '1'
        run: |
          git config user.name "Bot Aggiornamento GTFS"
          git config user.email "bot@actions.github.io"
          git add data/*.zip
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico file GTFS ACTV ($(date +'%Y-%m-%d %H:%M'))"
            git push
            echo "Modifiche GTFS salvate e inviate con successo!"
          fi
