name: Aggiorna GTFS ACTV

on:
  schedule:
    # Esegue ogni 2 ore per controllare i nuovi file GTFS
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica e verifica i GTFS ACTV
        run: |
          mkdir -p data
          UPDATED=0

          declare -A urls=(
            ["actv_nav"]="https://actv.avmspa.it/sites/default/files/attachments/opendata/navigazione/actv_nav.zip"
            ["actv_aut"]="https://actv.avmspa.it/sites/default/files/attachments/opendata/automobilistico/actv_aut.zip"
          )

          for name in "${!urls[@]}"; do
            url="${urls[$name]}"
            target="data/$name.zip"
            tmp="data/$name.tmp.zip"

            echo "Controllo e download di $name..."
            
            # Scarica sempre il file temporaneo (senza filtri sulla data)
            curl -s -fL --retry 3 "$url" -o "$tmp"

            # Verifica che il file scaricato esista, non sia vuoto e sia uno ZIP valido (Magic Number PK)
            if [ -f "$tmp" ] && [ -s "$tmp" ]; then
              if head -c 2 "$tmp" | grep -q "PK"; then
                
                # Se il file target precedente esiste, confrontiamo gli hash MD5
                if [ -f "$target" ]; then
                  old_hash=$(md5sum "$target" | awk '{print $1}')
                  new_hash=$(md5sum "$tmp" | awk '{print $1}')
                  
                  if [ "$old_hash" != "$new_hash" ]; then
                    mv "$tmp" "$target"
                    UPDATED=1
                    echo "-> Il file $name è CAMBIATO! Aggiornato con successo."
                  else
                    echo "-> Il file $name è identico alla versione precedente. Nessuna modifica."
                    rm -f "$tmp"
                  fi
                else
                  # Se il file target non esiste proprio, lo salviamo
                  mv "$tmp" "$target"
                  UPDATED=1
                  echo "-> File $name salvato per la prima volta."
                fi

              else
                echo "-> Attenzione: il file scaricato per $name non è uno ZIP valido. Scartato."
                rm -f "$tmp"
              fi
            else
              echo "-> Errore nel download di $name."
              rm -f "$tmp"
            fi
          done

          echo "HAS_CHANGES=$UPDATED" >> $GITHUB_ENV

      - name: Commit e Push se ci sono modifiche nei GTFS
        if: env.HAS_CHANGES == '1'
        run: |
          git config user.name "Bot Aggiornamento GTFS"
          git config user.email "bot@actions.github.io"
          git add data/*.zip
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico file GTFS ACTV ($(date +'%Y-%m-%d %H:%M'))"
            git push
            echo "Modifiche GTFS salvate e inviate con successo alla repository!"
          fi
